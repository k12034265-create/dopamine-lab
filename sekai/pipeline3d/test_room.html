<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const W=1920,H=1080;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.setPixelRatio(1); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.05; r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color('#1a1d26'); s.fog=new THREE.Fog('#1a1d26',14,30);
const cam=new THREE.PerspectiveCamera(32,W/H,0.1,100);
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:o.r??0.85,metalness:o.m??0,flatShading:true,emissive:o.e||'#000',emissiveIntensity:o.ei||0});
function box(w,h,d,mat,x,y,z,ry=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.rotation.y=ry;m.castShadow=true;m.receiveShadow=true;s.add(m);return m;}
// room
box(12,0.2,10,M('#6b4e3a'),0,-0.1,0);           // wooden floor
box(12,6,0.2,M('#3a3f4b'),0,3,-4);                // back wall
box(0.2,6,10,M('#343944'),-6,3,0);                // left wall
// window with night city
const win=box(3.2,2.2,0.05,M('#0d1424',{e:'#1d2c55',ei:0.6}),2.2,3.4,-3.88);
for(let i=0;i<14;i++){const h=0.4+Math.random()*1.3; box(0.18,h,0.02,M('#0a0f1c',{e:'#ffcf7a',ei:Math.random()<.5?0.0:0.0}),0.8+i*0.2,2.3+h/2,-3.84);}
for(let i=0;i<30;i++){box(0.03,0.03,0.01,M('#000',{e:'#ffd27a',ei:2}),0.75+Math.random()*2.9,2.4+Math.random()*1.0,-3.82);}
box(3.4,0.12,0.15,M('#cfc6b8'),2.2,4.55,-3.8); box(3.4,0.12,0.15,M('#cfc6b8'),2.2,2.25,-3.8); box(0.08,2.3,0.12,M('#cfc6b8'),2.2,3.4,-3.8);
// bookshelf
box(1.6,3.2,0.6,M('#4a3426'),-4.6,1.6,-3.4);
const bc=['#7a2e2e','#2e4a7a','#7a6a2e','#3d6b4f','#5b3d6b','#8a7a64'];
for(let sh=0;sh<4;sh++){box(1.5,0.05,0.55,M('#3a281c'),-4.6,0.35+sh*0.75,-3.35);let x=-5.3;while(x<-3.95){const w=0.06+Math.random()*0.08,h=0.45+Math.random()*0.2;box(w,h,0.4,M(bc[(Math.random()*6)|0]),x+w/2,0.38+sh*0.75+h/2,-3.3);x+=w+0.01;}}
// desk + lamp
box(2.4,0.08,1.1,M('#7b5a43'),-0.6,1.1,-1.8); for(const [dx,dz] of [[-1.1,-0.45],[1.1,-0.45],[-1.1,0.45],[1.1,0.45]]) box(0.07,1.1,0.07,M('#5a4232'),-0.6+dx,0.55,-1.8+dz);
box(0.5,0.02,0.36,M('#efe6d2'),-0.4,1.15,-1.6,0.2); box(0.5,0.02,0.36,M('#e9dfc9'),-0.0,1.15,-1.6,-0.1);
const lampBase=box(0.25,0.04,0.25,M('#b08a4a',{m:.6,r:.4}),-1.5,1.16,-2.0);
box(0.03,0.7,0.03,M('#b08a4a',{m:.6,r:.4}),-1.5,1.5,-2.0);
const shade=new THREE.Mesh(new THREE.ConeGeometry(0.28,0.3,16,1,true),new THREE.MeshStandardMaterial({color:'#f2d9a0',emissive:'#ffcc77',emissiveIntensity:1.4,side:THREE.DoubleSide,flatShading:true}));shade.position.set(-1.5,1.95,-2.0);s.add(shade);
const lamp=new THREE.PointLight('#ffb866',18,8,1.6); lamp.position.set(-1.5,1.8,-2.0); lamp.castShadow=true; lamp.shadow.mapSize.set(2048,2048); s.add(lamp);
// chair
box(0.6,0.06,0.6,M('#2f3540'),-0.6,0.62,-0.9); box(0.6,0.7,0.06,M('#2f3540'),-0.6,1.0,-0.6); for(const [dx,dz] of [[-.25,-.25],[.25,-.25],[-.25,.25],[.25,.25]]) box(0.04,0.6,0.04,M('#20252d'),-0.6+dx,0.3,-0.9+dz);
// low-poly person (back view, seated)
const skin=M('#e7c2a0'), suit=M('#2b3242'), hair=M('#1b1612');
const body=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.24,0.62,8),suit); body.position.set(-0.6,1.0,-1.0); body.castShadow=true; s.add(body);
const head=new THREE.Mesh(new THREE.IcosahedronGeometry(0.15,1),skin); head.position.set(-0.6,1.45,-1.02); head.castShadow=true; s.add(head);
const hr=new THREE.Mesh(new THREE.SphereGeometry(0.16,8,6,0,Math.PI*2,0,Math.PI*0.55),hair); hr.position.set(-0.6,1.47,-1.0); s.add(hr);
// ambient + moon fill
s.add(new THREE.HemisphereLight('#8aa0d0','#2a1e18',0.35));
const moon=new THREE.DirectionalLight('#9fb4ff',0.6); moon.position.set(3,6,-8); moon.castShadow=true; s.add(moon);
const pm=new THREE.PMREMGenerator(r); s.environment=pm.fromScene(new RoomEnvironment(),0.04).texture; s.environmentIntensity=0.15;
// dust
const N=400,pg=new THREE.BufferGeometry(),pp=new Float32Array(N*3);for(let i=0;i<N;i++){pp[i*3]=-3+Math.random()*5;pp[i*3+1]=0.5+Math.random()*3;pp[i*3+2]=-3+Math.random()*3;}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3)); const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:'#ffd9a0',size:0.018,transparent:true,opacity:0.6})); s.add(dust);
window.renderAt=(t)=>{ const k=t/8; cam.position.set(1.6-0.8*k,2.4-0.2*k,4.2-1.2*k); cam.lookAt(-0.8,1.4,-1.8); dust.rotation.y=t*0.02; lamp.intensity=18*(0.97+0.03*Math.sin(t*7)); r.render(s,cam); return true; };
window.READY=true;
</script></body></html>
