<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#stage,#ov,#vig,#grain{position:absolute;left:0;top:0;width:1920px;height:1080px}
#ov{pointer-events:none;font-family:'Noto Sans CJK JP','Noto Sans CJK SC',sans-serif;color:#fff}
#vig{background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#grain{opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#fade{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000;opacity:0;pointer-events:none}
.sub{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-weight:700;font-size:40px;line-height:1.45;letter-spacing:1px;
  text-shadow:0 0 6px rgba(0,0,0,.9),0 2px 3px rgba(0,0,0,.9),0 0 2px #000; -webkit-text-stroke:0.6px rgba(0,0,0,.6)}
.serif{font-family:'Noto Serif CJK JP','Noto Serif CJK SC',serif}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="stage"></div><div id="vig"></div><canvas id="grain" width="480" height="270"></canvas><div id="fade"></div><div id="ov"></div>
<script type="module">
const q=new URLSearchParams(location.search);
const mod=await import(q.get('scenes'));
const SC=mod.SCENES; const cache={};
const gc=document.getElementById('grain').getContext('2d'); const gimg=gc.createImageData(480,270);
function grain(seed){let s=seed*9301+49297;const d=gimg.data;for(let i=0;i<d.length;i+=4){s=(s*1103515245+12345)&0x7fffffff;const v=(s>>16)&255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}gc.putImageData(gimg,0,0);}
function wrap(sub){ if(!sub) return ''; const max=30; if(sub.length<=max) return sub;
  let mid=Math.floor(sub.length/2), best=-1; for(let d=0;d<14&&best<0;d++){for(const k of [mid+d,mid-d]){if('、，'.includes(sub[k])){best=k;break;}}} if(best<0)best=mid;
  return sub.slice(0,best+1)+'<br>'+sub.slice(best+1); }
window.FRAME=async(i,t,dur,sub,frameNo)=>{
  if(!cache[i]) cache[i]=SC[i].build();
  const S=cache[i]; const html=S.update(t,dur)||'';
  S.render();
  const f=Math.min(1,t/0.35,(dur-t)/0.35); document.getElementById('fade').style.opacity=(1-Math.max(0,f)).toFixed(3);
  document.getElementById('ov').innerHTML=html+(sub?`<div class="sub">${wrap(sub)}</div>`:'');
  grain(frameNo||0);
  return true;
};
window.READY=true;
</script></body></html>
