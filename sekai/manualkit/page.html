<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#F4F1EA;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
const g=document.getElementById('c').getContext('2d'); const q=new URLSearchParams(location.search); const F=await import(q.get('scenes')); const U=await import('/manualkit/ui.js'); const I=await import('/manualkit/iso.js');
if(F.load) await F.load();
for(const w of [500,700,900]) await document.fonts.load(`${w} 40px "Noto Sans CJK JP"`,'給料1');
window.FRAME=(i,t,dur,subs,chap)=>{ try{ g.setTransform(1,0,0,1,0,0); g.globalAlpha=1; U.frameBg(g); let st=''; for(const [a,b,x] of subs) if(a<=t && t<b+0.15) st=x;
  const S={i,t,dur,subs,subText:st,chap,src:(F.SRC||{})[i]||'',sub:(n)=>subs[Math.min(n,subs.length-1)][0],k:(t0,d=.5)=>I.ease(I.cl((t-t0)/d)),e:(t0,d=.5)=>I.eo(I.cl((t-t0)/d))};
  const fn=F.SC[i]; if(fn){ g.save(); fn(g,S); g.restore(); } U.frameUI(g,S); return 'ok'; }catch(e){ return 'ERR '+e.message+' '+(e.stack||'').split('\n').slice(1,3).join(' | '); } };
window.READY=true;
</script></body></html>
