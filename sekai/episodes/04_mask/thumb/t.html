<html><head><meta charset="utf-8"><style>body{margin:0;width:1280px;height:720px;overflow:hidden;background:radial-gradient(ellipse at 70% 35%,#2b2a3a,#0c0b12 75%);font-family:'Noto Sans CJK JP';}
.t{position:absolute;left:46px;top:30px;color:#fff;font-weight:900;line-height:1.08;text-shadow:0 6px 18px #000,0 0 3px #000}
.a{font-size:64px}.b{font-size:118px;letter-spacing:-2px}.p{color:#ff86b4}.y{color:#ffd24a}
</style></head><body>
<svg width="1280" height="720" style="position:absolute;left:0;top:0">
<defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g transform="translate(930,250)">
 <circle r="150" fill="#ef7fa8"/><circle cx="-52" cy="-20" r="14" fill="#1b1a20"/><circle cx="52" cy="-20" r="14" fill="#1b1a20"/>
 <path d="M-108,4 Q0,-14 108,4 L94,104 Q0,138 -94,104Z" fill="#f4f4f2"/><path d="M-90,50 Q0,38 90,50 M-90,76 Q0,64 90,76" stroke="rgba(0,0,0,.2)" stroke-width="5" fill="none"/>
</g>
<g transform="translate(1180,190)" filter="url(#g)"><path d="M0,120 V-40" stroke="#ffd24a" stroke-width="22" stroke-linecap="round"/><path d="M-40,0 L0,-55 L40,0" stroke="#ffd24a" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="row"></g>
</svg>
<div class="t"><div class="a">なぜ</div><div class="b"><span class="p">マスク</span>で</div><div class="b"><span class="p">美人</span>に</div><div class="b">見えるの？</div></div>
<script>
let s='';for(let i=0;i<13;i++){const x=40+i*100, on=i%3!==1, m=i%2, c=on?(m?'#4f8fea':'#ef7fa8'):'#4a4852', y=640;
s+=`<g transform="translate(${x},${y})" ${on?'filter="url(#g)"':''}><circle cy="-62" r="24" fill="${c}"/><rect x="-18" y="-58" width="36" height="16" rx="5" fill="${on?'#f4f4f2':'#6a6872'}"/><rect x="-26" y="-34" width="52" height="66" rx="14" fill="${c}"/><rect x="-20" y="30" width="16" height="44" rx="5" fill="${c}"/><rect x="4" y="30" width="16" height="44" rx="5" fill="${c}"/></g>`;}
document.getElementById('row').innerHTML=s;
</script></body></html>
